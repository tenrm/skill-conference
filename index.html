<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conference Skills · STT52 Field Guide</title>
<meta name="description" content="คู่มือและงานมอบหมายสำหรับนิสิตที่ไปร่วมประชุมวิชาการ STT52 (23–25 พ.ย. 2569, KICE ขอนแก่น) / Student guide & assignments for STT52.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#1d2327; --muted:#5f6b72; --line:#e3e1da;
  --accent:#0f6b5c; --accent-2:#e0efe9; --warn:#a4501b; --warn-bg:#fbefe4; --info-bg:#eaf1f8; --info:#24527a;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.65;font-size:16px}
body.lang-th{font-family:"IBM Plex Sans Thai","Inter",system-ui,sans-serif}
a{color:var(--accent)}
h1,h2,h3,h4{line-height:1.3;margin:0 0 .5em}
h2{font-size:1.45rem} h3{font-size:1.1rem} h4{font-size:1rem}
p{margin:.3em 0 .8em}
ul,ol{margin:.2em 0 .9em;padding-left:1.3em}
li{margin:.2em 0}
small,.muted{color:var(--muted)}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(246,245,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-size:1.05rem}
.brand span{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:.3rem;background:#ebe9e2;padding:.25rem;border-radius:999px}
.tabs button{border:0;background:transparent;padding:.45rem 1rem;border-radius:999px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:var(--surface);padding:.4rem .8rem;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--accent);color:#fff}
/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:1.2rem 1rem 4rem;display:grid;grid-template-columns:240px 1fr;gap:1.5rem}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto}
.side a{display:block;padding:.35rem .7rem;border-radius:8px;text-decoration:none;color:var(--muted);font-size:.92rem}
.side a:hover{background:#ebe9e2;color:var(--ink)}
.side a.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.side .sgroup{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;padding:.8rem .7rem .2rem}
.side .sgroup:first-child{padding-top:.2rem}
input[type=date]{font:inherit;font-size:.95rem;padding:.45rem .6rem;border:1px solid #cfccc3;border-radius:8px;width:100%}
.side .prog{margin:.8rem .7rem;font-size:.85rem}
main{min-width:0}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem 1.5rem;margin-bottom:1.2rem;box-shadow:var(--shadow);scroll-margin-top:84px}
section.card.hero{background:linear-gradient(135deg,#0f6b5c,#164d63);color:#fff;border:0}
.hero h1{font-size:1.8rem;margin-bottom:.3em}
.hero p{opacity:.92}
.hero .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.7rem;margin-top:1rem}
.hero .fact{background:rgba(255,255,255,.12);border-radius:10px;padding:.6rem .8rem;font-size:.9rem}
.hero .fact b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.hero a{color:#fff}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:.2rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.box{border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;background:#fcfbf8}
.box h4{margin-bottom:.3em}
.note{background:var(--info-bg);color:var(--info);border-radius:10px;padding:.7rem 1rem;font-size:.93rem;margin:.6rem 0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:.7rem 1rem;font-size:.93rem;margin:.6rem 0}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:.1rem .55rem;border-radius:999px;background:var(--accent-2);color:var(--accent);margin-right:.3rem;white-space:nowrap}
.pill.gray{background:#eceae4;color:var(--muted)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
/* checklist */
.check{list-style:none;padding:0;margin:.4rem 0 1rem}
.check li{display:flex;gap:.6rem;align-items:flex-start;padding:.4rem .5rem;border-radius:8px}
.check li:hover{background:#f6f5f1}
.check input{margin-top:.35rem;width:18px;height:18px;accent-color:var(--accent);flex:none}
.check li.done span{color:var(--muted);text-decoration:line-through}
.bar{height:8px;background:#e8e6df;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* table */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:.45rem .5rem;text-align:left;vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#faf9f6}
.tblwrap{overflow-x:auto}
/* forms */
label.f{display:block;font-weight:600;font-size:.88rem;margin:.6rem 0 .2rem}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;font:inherit;font-size:.95rem;padding:.5rem .65rem;border:1px solid #cfccc3;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:.9rem;padding:.45rem .9rem;border-radius:8px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.danger{background:#fff;color:#a12a2a;border-color:#d9a3a3}
.btn.sm{font-size:.8rem;padding:.25rem .6rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 .9rem}
.item{border:1px solid var(--line);border-radius:12px;padding:.6rem 1rem 1rem;margin:.8rem 0;background:#fcfbf8;position:relative}
.item .del{position:absolute;top:.6rem;right:.6rem}
.item h4{margin:.3rem 0 .2rem;font-size:.95rem;color:var(--accent)}
.out{white-space:pre-wrap;background:#f3f2ed;border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;font-size:.92rem;margin:.6rem 0}
.score{display:flex;gap:.25rem}
.score button{width:32px;height:32px;border-radius:8px;border:1px solid #cfccc3;background:#fff;font:inherit;font-weight:600;cursor:pointer}
.score button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.crit{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;align-items:center;padding:.35rem 0;border-bottom:1px dashed var(--line)}
.crit small{display:block}
/* planner */
.day{margin:1rem 0}
.day h3{display:flex;gap:.5rem;align-items:center}
.slot{display:grid;grid-template-columns:120px 1fr;gap:.6rem;margin:.4rem 0;align-items:start}
.slot .t{font-size:.82rem;color:var(--muted);font-weight:600;padding-top:.35rem}
.blocks{display:flex;flex-wrap:wrap;gap:.4rem}
.blk{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.35rem .6rem;font-size:.82rem;cursor:pointer;text-align:left;font:inherit;font-size:.82rem;line-height:1.35;max-width:260px}
.blk b{display:block;font-size:.72rem;color:var(--muted)}
.blk.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.blk.on b{color:#d6efe8}
.blk.fixed{background:#f1efe9;cursor:default}
.blk.clash{outline:2px solid #d0782f}
/* assignments */
.asg{border-left:5px solid var(--accent)}
.asg-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.asg-meta{display:flex;gap:.4rem;flex-wrap:wrap;margin:.3rem 0 .6rem}
details.more{margin:.6rem 0}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:.8rem 0}
.stat{background:#fcfbf8;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem}
.stat b{font-size:1.4rem;display:block;color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2327;color:#fff;padding:.55rem 1rem;border-radius:999px;font-size:.88rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.refs li{font-size:.88rem}
.hide{display:none!important}
@media (max-width:860px){
  .top{position:static}
  .tabs button{padding:.4rem .7rem;font-size:.85rem}
  .wrap{grid-template-columns:1fr}
  .side{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:.2rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.5rem}
  .side .prog{width:100%}
  .side .sgroup{width:100%;padding:.4rem .3rem 0}
  .slot{grid-template-columns:1fr}
  .hero h1{font-size:1.4rem}
  section.card{padding:1.1rem}
}
@media print{
  .top,.side,.btn,.noprint{display:none!important}
  .wrap{display:block;padding:0}
  section.card{box-shadow:none;break-inside:avoid-page;border:0;padding:.5rem 0}
  body{background:#fff}
  body.pr #printReport{display:block!important}
  body.pr #app{display:none!important}
}
#printReport{display:none;white-space:pre-wrap;font-size:11pt}
</style>
</head>

{ id:"key", nav:{th:"ข้อมูลสำคัญของงาน",en:"Key facts"},
  th:`<div class="eyebrow">รู้ไว้ก่อนไป</div><h2>ข้อมูลสำคัญของ STT52</h2>
<div class="grid2">
<div class="box"><h4>🎤 Keynote Speakers</h4><ul>
<li><b>Prof. Dr. Hiroshi Amano</b> (Nobel Prize in Physics 2014) — III-Nitride semiconductors: from blue LEDs to sustainable electronics <span class="pill gray">pre-recorded</span></li>
<li><b>Prof. Dong-Yan Jin</b> (HKU) — SARS-CoV-2 science for COVID-19 prevention</li>
<li><b>Asst. Prof. Dr. Chayasith Uttamapinant</b> (VISTEC, Outstanding Scientist Award 2026) — Genetic code expansion tools</li></ul></div>
<div class="box"><h4>🗂️ Sessions หลัก</h4><ul>
<li>A Physics · B Biological Sciences · C Chemistry</li>
<li>D Math/Stat/CS/Data Science/AI · E Environmental & Earth</li>
<li>F Food Sci/Agri · G Materials Science</li>
<li>Symposia เช่น SP3 Smart Sensing, SP5 Biodiversity, SP6 AI in Science & Medicine, SP8 Science Communication, SP13/14 YRSS/JYRSS</li></ul></div>
<div class="box"><h4>🖼️ กติกาโปสเตอร์</h4><ul>
<li>ต้องเป็น<b>ภาษาอังกฤษ</b> ขนาดไม่เกิน <b>90 × 120 ซม.</b> (กว้าง × สูง)</li>
<li>มี title, objectives, methodology, results, discussion, conclusion</li>
<li>เวลาติดโปสเตอร์ประกาศตามรหัสผลงาน — ผู้จัดเตรียมเทปให้</li>
<li>ต้อง<b>ยืนประจำโปสเตอร์</b>ในช่วงเวลาที่กำหนด</li></ul></div>
<div class="box"><h4>📽️ กติกาการบรรยาย (Oral)</h4><ul>
<li><b>12 นาที + ถามตอบ 3 นาที</b> เป็นภาษาอังกฤษ — คุมเวลาเคร่งครัด</li>
<li>ใช้ PowerPoint ควบคุมเอง แนะนำฝังฟอนต์หรือใช้ PDF</li>
<li>ต้องโหลดไฟล์และทดสอบก่อนถึงเวลา</li>
<li>นิสิตต้องนำเสนอเดี่ยว ไม่อนุญาตนำเสนอเป็นกลุ่ม</li></ul></div>
<div class="box"><h4>🏆 รางวัล (เฉพาะนิสิต/นักศึกษา)</h4><ul>
<li>Best Poster Award: ผลงานโปสเตอร์ใน Session A–F ตัดสินจากการนำเสนอและการตอบคำถาม</li>
<li>Best Oral Presentation: ตัดสินโดยกรรมการแต่ละ session</li>
<li>ประกาศผลใน Awarding Ceremony วันพุธบ่าย</li></ul></div>
<div class="box"><h4>⏰ จังหวะของแต่ละวัน</h4><ul>
<li>เช้า 08:30–12:00 · กลางวัน 12:00–13:00 (Hall 3) · บ่าย 13:00–16:30</li>
<li>Coffee break 10:15–10:30 และ 14:45–15:00</li>
<li>Poster Session หลัก: จันทร์ 16:00–18:00 (Hall 3)</li>
<li>Poster YRSS/JYRSS: อังคาร 14:00–17:00 · Banquet: อังคารค่ำ</li></ul></div>
</div>
<div class="note">ข้อมูลรวบรวมจากเว็บไซต์ STT52 (ณ 20 พ.ย. 2569) — ตารางรายเรื่องและเวลาที่แน่นอนให้ดูใน <a href="${LINKS.book}" target="_blank">Program Book</a> และประกาศหน้างานเสมอ</div>`,
  en:`<div class="eyebrow">Know before you go</div><h2>STT52 key facts</h2>
<div class="grid2">
<div class="box"><h4>🎤 Keynote speakers</h4><ul>
<li><b>Prof. Dr. Hiroshi Amano</b> (Nobel Prize in Physics 2014) — III-Nitride semiconductors: from blue LEDs to sustainable electronics <span class="pill gray">pre-recorded</span></li>
<li><b>Prof. Dong-Yan Jin</b> (HKU) — SARS-CoV-2 science for COVID-19 prevention</li>
<li><b>Asst. Prof. Dr. Chayasith Uttamapinant</b> (VISTEC, Outstanding Scientist Award 2026) — Genetic code expansion tools</li></ul></div>
<div class="box"><h4>🗂️ Main sessions</h4><ul>
<li>A Physics · B Biological Sciences · C Chemistry</li>
<li>D Math/Stat/CS/Data Science/AI · E Environmental & Earth</li>
<li>F Food Sci/Agri · G Materials Science</li>
<li>Symposia, e.g. SP3 Smart Sensing, SP5 Biodiversity, SP6 AI in Science & Medicine, SP8 Science Communication, SP13/14 YRSS/JYRSS</li></ul></div>
<div class="box"><h4>🖼️ Poster rules</h4><ul>
<li>Must be in <b>English</b>, no larger than <b>90 × 120 cm</b> (W × H)</li>
<li>Include title, objectives, methodology, results, discussion, conclusion</li>
<li>Mounting time is announced by presentation code; tape is provided</li>
<li>You must <b>stand by your poster</b> during your scheduled session</li></ul></div>
<div class="box"><h4>📽️ Oral rules</h4><ul>
<li><b>12 min talk + 3 min Q&A</b> in English — strictly timed</li>
<li>PowerPoint controlled by the speaker; embed fonts or use PDF</li>
<li>Load and test your file before your session</li>
<li>Student presentations must be individual (no group talks)</li></ul></div>
<div class="box"><h4>🏆 Awards (students only)</h4><ul>
<li>Best Poster Award: poster presenters in Sessions A–F, judged on presentation and Q&A</li>
<li>Best Oral Presentation: selected by each session committee</li>
<li>Announced at the Awarding Ceremony (Wednesday afternoon)</li></ul></div>
<div class="box"><h4>⏰ Daily rhythm</h4><ul>
<li>Morning 08:30–12:00 · Lunch 12:00–13:00 (Hall 3) · Afternoon 13:00–16:30</li>
<li>Coffee breaks 10:15–10:30 and 14:45–15:00</li>
<li>Main Poster Session: Mon 16:00–18:00 (Hall 3)</li>
<li>YRSS/JYRSS posters: Tue 14:00–17:00 · Banquet: Tue evening</li></ul></div>
</div>
<div class="note">Compiled from the STT52 website (as of 20 Nov 2026). Always check the <a href="${LINKS.book}" target="_blank">Program Book</a> and on-site announcements for exact talk times.</div>`},

{ id:"skills", nav:{th:"ทักษะที่ควรได้",en:"Skills to build"},
  th:`<div class="eyebrow">ทำไมต้องไป</div><h2>7 ทักษะที่นิสิตควรสร้างจากการไปประชุมวิชาการ</h2>
<div class="grid2">
<div class="box"><h4>1. ฟังเชิงวิทยาศาสตร์และจดโน้ต</h4>จับประเด็นหลัก วิธีการ หลักฐาน และข้อจำกัดของงาน ภายในเวลา 12 นาที</div>
<div class="box"><h4>2. ตั้งคำถามเชิงวิพากษ์</h4>ถามคำถามที่ชัด สุภาพ และต่อยอดงาน ทั้งในห้องและหน้าโปสเตอร์</div>
<div class="box"><h4>3. สื่อสารงานวิทยาศาสตร์ (ภาษาอังกฤษ)</h4>เล่างานตัวเองให้คนต่างสาขาเข้าใจใน 30 วินาที – 2 นาที</div>
<div class="box"><h4>4. สร้างเครือข่าย</h4>เริ่มบทสนทนา แลกช่องทางติดต่อ และ follow-up อย่างมืออาชีพ</div>
<div class="box"><h4>5. บริหารเวลาและเลือกสิ่งสำคัญ</h4>วางแผนห้องคู่ขนานหลายห้อง จัดลำดับความสำคัญ และเผื่อเวลาพัก</div>
<div class="box"><h4>6. วิจารณญาณด้านการออกแบบสื่อ</h4>วิเคราะห์ว่าโปสเตอร์/สไลด์ที่ดีทำอะไรต่างจากที่ไม่ดี แล้วนำมาปรับใช้</div>
<div class="box"><h4>7. ความเป็นมืออาชีพและการสะท้อนคิด</h4>มารยาท การแต่งกาย จริยธรรมการถ่ายภาพ และการทบทวนสิ่งที่ได้เรียนรู้</div>
</div>
<div class="note">ทุกงานในส่วนที่ 2 ออกแบบให้ฝึกทักษะเหล่านี้ และมีแบบประเมินตนเองก่อน–หลังในงานชิ้นสุดท้าย</div>`,
  en:`<div class="eyebrow">Why you are going</div><h2>7 skills to build at a scientific conference</h2>
<div class="grid2">
<div class="box"><h4>1. Scientific listening & note-taking</h4>Capture the key message, method, evidence and limitations within a 12-minute talk.</div>
<div class="box"><h4>2. Critical questioning</h4>Ask clear, polite, constructive questions in sessions and at posters.</div>
<div class="box"><h4>3. Science communication (English)</h4>Explain your work to non-specialists in 30 seconds to 2 minutes.</div>
<div class="box"><h4>4. Networking</h4>Start conversations, exchange contacts and follow up professionally.</div>
<div class="box"><h4>5. Time management & prioritising</h4>Plan across parallel rooms, set priorities and schedule rest.</div>
<div class="box"><h4>6. Visual design literacy</h4>Analyse what makes a poster or slide deck effective, and apply it.</div>
<div class="box"><h4>7. Professionalism & reflection</h4>Etiquette, dress, photo ethics, and reflecting on what you learned.</div>
</div>
<div class="note">Every assignment in Part 2 trains these skills; the final assignment includes a before/after self-assessment.</div>`},

{ id:"before", nav:{th:"เตรียมตัวก่อนไป",en:"Before you go"},
  th:`<div class="eyebrow">ขั้นที่ 1</div><h2>เตรียมตัวก่อนไป</h2>
<p>นิสิตที่ได้ประโยชน์สูงสุดคือคนที่ <b>รู้ว่าตัวเองไปเพื่ออะไร</b> ตั้งเป้าหมายให้ชัด (เช่น "อยากได้ไอเดียเทคนิคการวิเคราะห์ใหม่ 2 แบบ" หรือ "อยากได้ feedback เรื่องการออกแบบการทดลอง") แล้วใช้เป้าหมายนั้นเลือกว่าจะฟังอะไรและคุยกับใคร</p>
<h3>Checklist ก่อนไป</h3>{{w:check:before}}
<h3>ของที่ต้องเตรียม</h3>{{w:check:packing}}`,
  en:`<div class="eyebrow">Step 1</div><h2>Before you go</h2>
<p>Students who gain the most are those who <b>know why they are going</b>. Set clear goals (e.g. "find two new analysis techniques" or "get feedback on my experimental design") and use them to decide what to attend and whom to talk to.</p>
<h3>Pre-conference checklist</h3>{{w:check:before}}
<h3>What to pack</h3>{{w:check:packing}}`},

{ id:"choose", nav:{th:"เลือกงานจากโปรแกรม",en:"Choosing from the program"},
  th:`<div class="eyebrow">ขั้นที่ 2</div><h2>เลือกงานที่สนใจจากโปรแกรม</h2>
<ol>
<li><b>สแกนกว้าง</b> — เปิด Program Book และหน้า <a href="${LINKS.sessions}" target="_blank">Sessions</a> / <a href="${LINKS.symposiums}" target="_blank">Symposia</a> ไฮไลต์ทุกอย่างที่เกี่ยวกับงานตัวเอง</li>
<li><b>ค้นด้วยคำสำคัญ</b> — ใช้ช่องค้นหาใน <a href="${LINKS.abstracts}" target="_blank">Abstracts & Proceedings</a> ด้วยคำสำคัญของหัวข้อวิจัย เทคนิค หรือชื่อสิ่งมีชีวิต/วัสดุที่ศึกษา</li>
<li><b>จัดลำดับ 3 ระดับ</b>:
 <ul><li><span class="pill">ต้องไป</span> ตรงกับงานตัวเอง / keynote / คนที่อยากคุยด้วย</li>
 <li><span class="pill gray">ควรไป</span> เทคนิคหรือคำถามใกล้เคียงที่นำมาประยุกต์ได้</li>
 <li><span class="pill warn">เปิดโลก</span> อย่างน้อย 1 ช่วงที่อยู่นอกสาขา เช่น SP6 AI หรือ SP8 Science Communication</li></ul></li>
<li><b>ดูเจ้าของงาน ไม่ใช่แค่ชื่อเรื่อง</b> — invited speaker และกลุ่มวิจัยที่แข็งแรงมักให้ภาพรวมของสาขาได้ดี</li>
<li><b>อย่าลืมโปสเตอร์และบูธ</b> — โปสเตอร์คือที่ที่คุยกับเจ้าของงานได้ลึกที่สุด</li>
</ol>
<div class="note">กติกาง่าย ๆ: เวลา ~60% ฟัง talk · ~25% โปสเตอร์และบูธ · ~15% คุยกับคนและพัก</div>`,
  en:`<div class="eyebrow">Step 2</div><h2>Choosing what to attend</h2>
<ol>
<li><b>Scan broadly</b> — open the Program Book and the <a href="${LINKS.sessions}" target="_blank">Sessions</a> / <a href="${LINKS.symposiums}" target="_blank">Symposia</a> pages; highlight everything related to your work.</li>
<li><b>Search by keyword</b> — use the <a href="${LINKS.abstracts}" target="_blank">Abstracts & Proceedings</a> search with keywords for your topic, technique, organism or material.</li>
<li><b>Rank in three tiers</b>:
 <ul><li><span class="pill">Must</span> directly related to your work / keynotes / people you want to meet</li>
 <li><span class="pill gray">Should</span> adjacent methods or questions you could adapt</li>
 <li><span class="pill warn">Explore</span> at least one slot outside your field, e.g. SP6 AI or SP8 Science Communication</li></ul></li>
<li><b>Look at who, not just what</b> — invited speakers and strong groups often give the best overview of a field.</li>
<li><b>Don't skip posters and booths</b> — posters are where you can talk most deeply with authors.</li>
</ol>
<div class="note">Rule of thumb: ~60% of your time on talks · ~25% posters & booths · ~15% conversations and rest.</div>`},

{ id:"planner", nav:{th:"วางแผนเวลา & ห้อง",en:"Time & room planner"},
  th:`<div class="eyebrow">ขั้นที่ 3</div><h2>จัดสรรเวลาและวางแผนเข้าห้องต่าง ๆ</h2>
<p>แต่ละ session เป็นบล็อก 3.5 ชั่วโมงที่มี talk ย่อยหลายเรื่อง (เรื่องละ 12+3 นาที) และมีหลายห้องจัดคู่ขนานกัน <b>คลิกบล็อกที่จะเข้าร่วม</b> ระบบจะเตือนเมื่อเลือกห้องชนกันในช่วงเดียวกัน (ซึ่งทำได้ ถ้าตั้งใจย้ายห้องตามเวลา talk) จากนั้นเพิ่ม talk รายเรื่องที่ต้องการฟังจาก Program Book</p>
{{w:planner}}
<h3>เคล็ดลับการย้ายห้อง</h3>
<ul>
<li>ย้ายห้อง<b>ระหว่างช่วงเปลี่ยนเรื่อง</b> (หลังถามตอบ) ไม่ลุกออกกลาง talk</li>
<li>ถ้าวางแผนจะออกก่อน ให้นั่งริมทางเดินหรือแถวหลัง</li>
<li>ห้อง M4–M6 จุ ~40 คน — talk ยอดนิยมควรไปก่อน 5–10 นาที</li>
<li>มีแผนสำรองทุกช่วง (talk ถูกยกเลิก/เลื่อนบ่อย)</li>
<li>อย่าจัดตารางเต็ม 100% — สมองล้าภายในครึ่งวัน เผื่อเวลาเดินดูโปสเตอร์ บูธ และพัก</li>
</ul>`,
  en:`<div class="eyebrow">Step 3</div><h2>Allocating time and planning rooms</h2>
<p>Each session is a 3.5-hour block containing many talks (12+3 min each), with several rooms running in parallel. <b>Click the blocks you plan to attend</b>; the planner flags clashes within the same slot (fine if you deliberately hop between rooms by talk time). Then add specific talks from the Program Book.</p>
{{w:planner}}
<h3>Room-hopping tips</h3>
<ul>
<li>Change rooms <b>between talks</b> (after Q&A), never in the middle of one.</li>
<li>If you plan to leave early, sit on the aisle or at the back.</li>
<li>Rooms M4–M6 seat ~40 — arrive 5–10 minutes early for popular talks.</li>
<li>Keep a plan B for each slot; talks get cancelled or moved.</li>
<li>Don't fill 100% of your schedule — attention fades by midday. Leave time for posters, booths and rest.</li>
</ul>`},

{ id:"listen", nav:{th:"ฟัง จดโน้ต และถาม",en:"Listen, note, ask"},
  th:`<div class="eyebrow">ขั้นที่ 4</div><h2>ฟังให้ได้เนื้อ จดให้ได้ใช้ ถามให้ได้คุย</h2>
<div class="grid2">
<div class="box"><h4>📝 โครงโน้ต 4 ช่อง (ทุก talk)</h4><ol>
<li><b>Key message</b> — ประโยคเดียว งานนี้บอกอะไร</li>
<li><b>Method / evidence</b> — ทำอย่างไร ข้อมูลอะไรสนับสนุน</li>
<li><b>Takeaway</b> — อะไรเอามาใช้กับงานเราได้</li>
<li><b>Question</b> — สิ่งที่ยังสงสัย/อยากถาม</li></ol></div>
<div class="box"><h4>❓ ถามคำถามให้ดี</h4><ul>
<li>ขึ้นต้นด้วยขอบคุณ แนะนำตัวสั้น ๆ</li>
<li>ถามข้อเดียว ชัด ไม่เกิน 20 วินาที</li>
<li>ถามเพื่อเข้าใจ/ต่อยอด ไม่ใช่เพื่อโชว์</li>
<li>ถ้าเวลาไม่พอ ไปถามต่อหลัง session — เป็นจุดเริ่มต้น networking ที่ดีที่สุด</li></ul></div>
</div>
<h3>ตัวอย่างประโยคถาม (ภาษาอังกฤษ)</h3>
<ul>
<li>"Thank you for the talk. You mentioned ___ — could you say a bit more about how you ___?"</li>
<li>"How sensitive are your results to ___? Did you try ___?"</li>
<li>"Your work reminds me of ___. Do you think the approach could apply to ___?"</li>
<li>"What was the biggest practical challenge in ___?"</li>
<li>"Could you go back to the slide on ___?"</li>
</ul>`,
  en:`<div class="eyebrow">Step 4</div><h2>Listen well, take usable notes, ask good questions</h2>
<div class="grid2">
<div class="box"><h4>📝 Four-box note template (every talk)</h4><ol>
<li><b>Key message</b> — one sentence: what does this work show?</li>
<li><b>Method / evidence</b> — how was it done, what data support it?</li>
<li><b>Takeaway</b> — what can I use in my own work?</li>
<li><b>Question</b> — what is still unclear or worth asking?</li></ol></div>
<div class="box"><h4>❓ Asking good questions</h4><ul>
<li>Start with thanks and a short self-introduction.</li>
<li>Ask one clear question in under 20 seconds.</li>
<li>Ask to understand or extend, not to show off.</li>
<li>If time runs out, ask after the session — the best networking opener there is.</li></ul></div>
</div>
<h3>Question starters</h3>
<ul>
<li>"Thank you for the talk. You mentioned ___ — could you say a bit more about how you ___?"</li>
<li>"How sensitive are your results to ___? Did you try ___?"</li>
<li>"Your work reminds me of ___. Do you think the approach could apply to ___?"</li>
<li>"What was the biggest practical challenge in ___?"</li>
<li>"Could you go back to the slide on ___?"</li>
</ul>`},

{ id:"posters", nav:{th:"ดูโปสเตอร์ที่ดี",en:"Reviewing posters"},
  th:`<div class="eyebrow">ขั้นที่ 5</div><h2>ดูโปสเตอร์อย่างนักวิจัย</h2>
<p>เดินดูโปสเตอร์รอบแรกแบบเร็ว (10 วินาที/แผ่น — เข้าใจไหมว่างานนี้เกี่ยวกับอะไร) แล้วกลับไปคุยกับเจ้าของงานในแผ่นที่น่าสนใจ ขอให้เขาเล่า 2 นาที ("Could you walk me through your poster?")</p>
<h3>เกณฑ์โปสเตอร์ที่ดี</h3>
<p class="muted">ดัดแปลงจาก Ten Simple Rules for a Good Poster Presentation (Erren & Bourne, 2007) และข้อกำหนดของ STT52 — ลองให้คะแนนโปสเตอร์ได้ที่นี่ (บันทึกจริงในงาน A3)</p>
{{w:rubric}}`,
  en:`<div class="eyebrow">Step 5</div><h2>Review posters like a researcher</h2>
<p>Do a quick first pass (10 seconds per poster — can you tell what it's about?), then return to the most interesting ones and ask the author for a 2-minute walkthrough ("Could you walk me through your poster?").</p>
<h3>What makes a good poster</h3>
<p class="muted">Adapted from Ten Simple Rules for a Good Poster Presentation (Erren & Bourne, 2007) and STT52 requirements — try scoring a poster here (record real ones in Assignment A3).</p>
{{w:rubric}}`},

{ id:"present", nav:{th:"นำเสนองานตัวเอง",en:"Presenting your work"},
  th:`<div class="eyebrow">ขั้นที่ 6</div><h2>นำเสนองานของตัวเอง</h2>
<div class="grid2">
<div class="box"><h4>🖼️ ถ้านำเสนอโปสเตอร์</h4><ul>
<li>ภาษาอังกฤษ ≤ 90×120 ซม. หัวข้อสั้นเหมือนพาดหัวข่าว</li>
<li>ข้อความหลักต้องเข้าใจได้ใน 10 วินาที, ตัวอักษรอ่านได้จากระยะ 1–2 ม.</li>
<li>เตรียมเล่า 3 ระดับ: 30 วินาที / 2 นาที / 5 นาที</li>
<li>มี QR code ไปยัง abstract/โปรไฟล์/อีเมล และสำเนา A4</li>
<li>ยืนข้างโปสเตอร์ตลอดช่วงเวลาที่กำหนด ยิ้ม ทักทาย แต่ไม่ตื๊อ</li>
<li>จดคำถามและ feedback ที่ได้ทุกข้อ</li></ul></div>
<div class="box"><h4>📽️ ถ้านำเสนอปากเปล่า</h4><ul>
<li>12 นาที ≈ 10–12 สไลด์ · ซ้อมจับเวลาอย่างน้อย 2 รอบ (รอบหนึ่งต่อหน้าเพื่อน/อาจารย์)</li>
<li>หนึ่งสไลด์ หนึ่งข้อความ ใส่ข้อสรุปเป็นหัวสไลด์</li>
<li>ฝังฟอนต์หรือแปลงเป็น PDF, โหลดไฟล์และทดสอบก่อน session</li>
<li>เตรียมสไลด์สำรอง (backup slides) สำหรับคำถามที่คาดไว้</li>
<li>ตอบคำถาม: ฟังจนจบ ทวนคำถาม ตอบตรง ถ้าไม่รู้ให้บอกตรง ๆ และเสนอคุยต่อ</li></ul></div>
</div>
<div class="warn">นิสิตที่นำเสนอมีสิทธิ์ลุ้น Best Poster / Best Oral — กรรมการดูทั้งการนำเสนอและการตอบคำถาม</div>`,
  en:`<div class="eyebrow">Step 6</div><h2>Presenting your own work</h2>
<div class="grid2">
<div class="box"><h4>🖼️ Poster presenters</h4><ul>
<li>English, ≤ 90×120 cm, a headline-style title</li>
<li>Main message understandable in 10 s; text readable from 1–2 m</li>
<li>Prepare 3 versions: 30 s / 2 min / 5 min</li>
<li>Add a QR code to your abstract/profile/email and A4 handouts</li>
<li>Stay at your poster for the whole slot; greet people but don't pressure them</li>
<li>Write down every question and piece of feedback</li></ul></div>
<div class="box"><h4>📽️ Oral presenters</h4><ul>
<li>12 min ≈ 10–12 slides · rehearse with a timer at least twice (once in front of peers/advisor)</li>
<li>One slide, one message; use the conclusion as the slide title</li>
<li>Embed fonts or use PDF; load and test before the session</li>
<li>Prepare backup slides for expected questions</li>
<li>Q&A: listen fully, repeat the question, answer directly; if you don't know, say so and offer to follow up</li></ul></div>
</div>
<div class="warn">Student presenters are eligible for Best Poster / Best Oral awards — judges assess both the presentation and the Q&A.</div>`},

{ id:"network", nav:{th:"สร้างเครือข่าย",en:"Networking"},
  th:`<div class="eyebrow">ขั้นที่ 7</div><h2>สร้างเครือข่าย: เป้าหมาย 5 คนใหม่</h2>
<p>เป้าหมายไม่ใช่เก็บนามบัตรให้ได้มากที่สุด แต่คือ <b>บทสนทนาที่มีความหมาย 5 ครั้ง</b> ที่ต่อยอดได้ พยายามให้หลากหลาย: อาจารย์/นักวิจัยอาวุโส, นิสิตต่างสถาบัน, ภาคอุตสาหกรรมหรือบูธ, วิทยากร</p>
<div class="grid2">
<div class="box"><h4>💬 ประโยคเปิดบทสนทนา</h4><ul>
<li>"Hi, I'm ___ from ___. How is the conference going for you?"</li>
<li>"I really enjoyed your talk on ___. May I ask about ___?"</li>
<li>"Which talk has been most interesting for you so far?"</li>
<li>"I work on ___ — I noticed your poster uses ___. How did you ___?"</li></ul></div>
<div class="box"><h4>🤝 ระหว่างคุย</h4><ul>
<li>ถามเรื่องงานของเขามากกว่าเล่าเรื่องตัวเอง</li>
<li>เก็บบทสนทนา 3–7 นาที แล้วปิดอย่างสุภาพ</li>
<li>"May I have your email / connect on LinkedIn?"</li>
<li>จดชื่อ + เรื่องที่คุย + สิ่งที่สัญญาไว้ ทันทีหลังคุย</li>
<li>ขออนุญาตก่อนถ่ายรูปคู่หรือจดข้อมูลติดต่อ</li></ul></div>
</div>
<h3>เครื่องมือสร้าง Elevator Pitch</h3>{{w:pitch}}
<h3>เครื่องมือร่างอีเมล Follow-up</h3>{{w:followup}}`,
  en:`<div class="eyebrow">Step 7</div><h2>Networking: target 5 new contacts</h2>
<p>The goal isn't to collect as many cards as possible but to have <b>five meaningful conversations</b> you can build on. Aim for variety: faculty/senior researchers, students from other institutions, industry or booth staff, speakers.</p>
<div class="grid2">
<div class="box"><h4>💬 Conversation openers</h4><ul>
<li>"Hi, I'm ___ from ___. How is the conference going for you?"</li>
<li>"I really enjoyed your talk on ___. May I ask about ___?"</li>
<li>"Which talk has been most interesting for you so far?"</li>
<li>"I work on ___ — I noticed your poster uses ___. How did you ___?"</li></ul></div>
<div class="box"><h4>🤝 During the conversation</h4><ul>
<li>Ask about their work more than you talk about yours.</li>
<li>Keep it to 3–7 minutes, then close politely.</li>
<li>"May I have your email / connect on LinkedIn?"</li>
<li>Note name + topic + any promise immediately afterwards.</li>
<li>Ask permission before taking a photo together or recording contact details.</li></ul></div>
</div>
<h3>Elevator pitch builder</h3>{{w:pitch}}
<h3>Follow-up email builder</h3>{{w:followup}}`},

{ id:"photo", nav:{th:"ถ่ายภาพ & มารยาท",en:"Photos & etiquette"},
  th:`<div class="eyebrow">ขั้นที่ 8</div><h2>ถ่ายภาพอย่างมีจริยธรรม และมารยาทในงาน</h2>
<div class="grid2">
<div class="box"><h4>✅ ควรทำ</h4><ul>
<li>ตรวจนโยบายการถ่ายภาพ/บันทึกเสียงของงานและประกาศในห้องก่อนเสมอ</li>
<li><b>ขออนุญาตเจ้าของโปสเตอร์</b>ก่อนถ่าย และถ่ายเพื่อการเรียนรู้เท่านั้น</li>
<li>ถ่ายภาพตัวเองกับโปสเตอร์/ป้ายงาน และภาพบรรยากาศสำหรับรายงาน</li>
<li>ตั้งชื่อไฟล์ทันที เช่น <code>D1_M7_SessionC_talk3.jpg</code></li>
<li>เมื่อโพสต์โซเชียล ให้ credit เจ้าของงานและติดแท็กงาน</li></ul></div>
<div class="box"><h4>⛔ ไม่ควรทำ</h4><ul>
<li>ถ่ายสไลด์ที่วิทยากรระบุว่า unpublished / ห้ามถ่าย</li>
<li>ใช้แฟลช ยืนบังผู้ฟัง หรือถ่ายวิดีโอทั้ง talk</li>
<li>เผยแพร่ข้อมูลที่ยังไม่ตีพิมพ์ของผู้อื่น</li>
<li>ถ่ายภาพบุคคลระยะใกล้โดยไม่ขออนุญาต</li>
<li>ใช้มือถือเสียงดังหรือคุยกันในห้องขณะมีการบรรยาย</li></ul></div>
</div>
<h3>ช็อตที่ควรมีในรายงาน</h3>
<ul>
<li>ตัวเองที่ป้ายงาน/จุดลงทะเบียน · ตัวเองขณะนำเสนอ (ให้เพื่อนถ่าย)</li>
<li>โปสเตอร์ที่ดีที่สุด 2 แผ่น (ได้รับอนุญาต) · สไลด์ออกแบบดี (ถ้าอนุญาต)</li>
<li>บรรยากาศห้อง/keynote · บูธที่เยี่ยมชม · ภาพกับผู้ติดต่อใหม่ (ได้รับอนุญาต)</li>
</ul>`,
  en:`<div class="eyebrow">Step 8</div><h2>Ethical photography and conference etiquette</h2>
<div class="grid2">
<div class="box"><h4>✅ Do</h4><ul>
<li>Check the conference's photo/recording policy and room announcements first.</li>
<li><b>Ask the poster author</b> before photographing; use photos for learning only.</li>
<li>Take photos of yourself with your poster/conference signage and of the atmosphere for your report.</li>
<li>Rename files immediately, e.g. <code>D1_M7_SessionC_talk3.jpg</code>.</li>
<li>When posting on social media, credit the authors and tag the conference.</li></ul></div>
<div class="box"><h4>⛔ Don't</h4><ul>
<li>Photograph slides marked unpublished or "no photos".</li>
<li>Use flash, block others' view, or record whole talks.</li>
<li>Share other people's unpublished data.</li>
<li>Take close-up photos of people without permission.</li>
<li>Let your phone ring or chat during talks.</li></ul></div>
</div>
<h3>Shots your report should include</h3>
<ul>
<li>You at the conference sign/registration · you presenting (ask a friend)</li>
<li>Two best posters (with permission) · a well-designed slide (if allowed)</li>
<li>Room/keynote atmosphere · booths you visited · you with new contacts (with permission)</li>
</ul>`},

{ id:"daily", nav:{th:"ระหว่างงาน (ทุกวัน)",en:"During the congress"},
  th:`<div class="eyebrow">ขั้นที่ 9</div><h2>สิ่งที่ต้องทำทุกวันระหว่างงาน</h2>{{w:check:daily}}
<div class="note">ดูแลตัวเอง: ดื่มน้ำ พักสายตา ออกไปเดินบ้าง ถ้าเหนื่อยเกินไป การพัก 1 ช่วงดีกว่านั่งฟังแบบไม่ได้อะไร หากเจอเหตุการณ์ไม่เหมาะสมหรือไม่ปลอดภัย ให้ออกจากสถานการณ์และแจ้งอาจารย์/ผู้จัดทันที</div>`,
  en:`<div class="eyebrow">Step 9</div><h2>Every day during the congress</h2>{{w:check:daily}}
<div class="note">Look after yourself: hydrate, rest your eyes, take short walks. Skipping one slot to rest beats sitting through talks you can't absorb. If anything feels inappropriate or unsafe, leave and tell your advisor or the organisers immediately.</div>`},

<h3>🧪 ประเมินงานประชุมที่สนใจ</h3>{{w:confcheck}}`,
  en:`<div class="eyebrow">Preparing your work · 2</div><h2>Finding the right conference</h2>
<p>Start from your <b>goal</b>: feedback on unfinished work? A proceedings publication? Meeting researchers in your field? Practising an English talk? Each goal suits a different kind of meeting.</p>
<div class="grid2">
<div class="box"><h4>🔎 Where to look</h4><ul>
<li>Your advisor and senior lab members — ask which meetings they attended and what they gained</li>
<li>Professional/scientific societies in your field (usually hold annual meetings)</li>
<li>Faculty/university announcements and mailing lists</li>
<li>Where researchers you often read present their work (CVs, publication lists)</li>
<li>Be wary of unsolicited email invitations — often from unreliable events</li></ul></div>
<div class="box"><h4>🧭 Types of meeting</h4><ul>
<li><b>National/society congress</b> (e.g. STT) — multidisciplinary, good for a first presentation, student awards</li>
<li><b>Specialised international conference</b> — experts in your niche, more competitive and costly</li>
<li><b>Student/young-scientist symposium</b> — friendly, great for practice and feedback</li>
<li><b>Workshop / training</b> — hands-on technical skills</li></ul></div>
</div>
<h3>Selection criteria</h3>
<ul>
<li><b>Scope fit</b> — a session/symposium that matches your topic (STT52 has Sessions A–G plus specialised symposia)</li>
<li><b>Audience & network</b> — will the people you want to meet attend? Who are the keynotes?</li>
<li><b>Organiser & credibility</b> — a known society/university, a long-running series (STT is in its 52nd edition)</li>
<li><b>Publication outlet</b> — abstract book, proceedings or journal; check indexing and any effect on later journal publication</li>
<li><b>Cost & funding</b> — registration + travel + accommodation, e.g. STT52 student presenter 3,000 THB (early-bird) / 3,800 THB (regular), attendee 2,200 / 2,900 THB (<a href="${LINKS.fees}" target="_blank">see fees</a>)</li>
<li><b>Timing</b> — will your results be ready by the deadline? Does it clash with exams or fieldwork?</li>
<li><b>Student opportunities</b> — Best Poster/Oral awards, travel grants, mentoring events</li>
</ul>
<div class="warn"><b>Beware of predatory conferences:</b> names that mimic famous meetings, any topic accepted, spam invitations, no clear committee, suspiciously fast acceptance, no stated publication outlet, high or vague fees. Check with <a href="${LINKS.tca}" target="_blank">Think. Check. Attend.</a> before submitting.</div>
<h3>🧪 Evaluate a conference you are considering</h3>{{w:confcheck}}`},

{ id:"cfp", nav:{th:"อ่านข้อกำหนดการส่งผลงาน",en:"Reading the submission rules"},
  th:`<div class="eyebrow">ช่วงเตรียมผลงาน · 3</div><h2>อ่าน Call for Papers ให้ครบก่อนเขียน</h2>
<p>ผลงานจำนวนมากถูกส่งกลับหรือถูกปฏิเสธเพราะ <b>ไม่ทำตามข้อกำหนด</b> ไม่ใช่เพราะคุณภาพวิทยาศาสตร์ ก่อนเริ่มเขียนให้สกัดข้อกำหนดทั้งหมดลงตาราง แล้วให้อาจารย์ดูด้วย</p>
<h3>ตัวอย่าง: ข้อกำหนดของ STT52</h3>
<div class="grid2">
<div class="box"><h4>📄 Abstract</h4><ul><li>ประมาณ <b>200 คำ</b></li><li>ไม่เกิน <b>1 หน้า</b></li><li>รูปหรือตาราง <b>ได้ 1 รายการ</b></li><li>หัวข้อที่ต้องมี: Title, Authors & Affiliation, Abstract</li></ul></div>
<div class="box"><h4>📘 Full paper</h4><ul><li><b>6–10 หน้า</b> มีรูปและตารางได้</li><li>ตีพิมพ์ใน proceedings book</li><li>ต้องส่ง <b>abstract + full paper พร้อมกัน</b> ส่ง abstract ก่อนแล้วตามด้วย full paper ภายหลังไม่ได้</li><li>หัวข้อ: Title, Authors & Affiliation, Abstract, Introduction, Methodology, Results and Discussion, Conclusion, Acknowledgements, References</li></ul></div>
<div class="box"><h4>✍️ รูปแบบ</h4><ul><li>ภาษาอังกฤษเท่านั้น</li><li>ใช้ template ของ STT52 ส่งทั้ง Word (.doc/.docx) และ PDF</li><li>ระยะบรรทัด single, จัดชิดขอบทั้งสองด้าน (justified), ระยะก่อน/หลังย่อหน้า 0 pt</li></ul></div>
<div class="box"><h4>⚖️ กติกาอื่น</h4><ul><li>ต้องเป็นงานต้นฉบับที่ยังไม่ตีพิมพ์ — คัดลอกผลงานถูกปฏิเสธ</li><li>ทุกผลงานผ่านการประเมินโดยผู้ทรงคุณวุฒิ (peer review)</li><li><b>เปลี่ยนประเภทหรือเนื้อหาหลังตอบรับไม่ได้</b></li><li>Template: <a href="${LINKS.tplAbs}" target="_blank">Abstract (.docx)</a> · <a href="${LINKS.tplFull}" target="_blank">Full paper (.doc)</a></li></ul></div>
</div>
<p class="muted">ที่มา: <a href="${LINKS.cfp}" target="_blank">STT52 Call for Papers</a></p>
<h3>📋 ตารางสกัดข้อกำหนดของงานที่จะส่ง</h3>
<p>กรอกจากประกาศของงานที่จะส่งจริง (กดปุ่มเพื่อดูตัวอย่างที่กรอกจาก STT52)</p>{{w:cfp}}`,
  en:`<div class="eyebrow">Preparing your work · 3</div><h2>Read the whole Call for Papers before writing</h2>
<p>Many submissions are returned or rejected for <b>not following the instructions</b>, not for weak science. Before you write, extract every requirement into a table and show it to your advisor.</p>
<h3>Example: STT52 requirements</h3>
<div class="grid2">
<div class="box"><h4>📄 Abstract</h4><ul><li>About <b>200 words</b></li><li><b>One page</b> maximum</li><li><b>One</b> figure or table allowed</li><li>Required: Title, Authors & Affiliation, Abstract</li></ul></div>
<div class="box"><h4>📘 Full paper</h4><ul><li><b>6–10 pages</b>, figures and tables allowed</li><li>Published in the proceedings book</li><li>Submit <b>abstract + full paper together</b> — you cannot add the full paper later</li><li>Sections: Title, Authors & Affiliation, Abstract, Introduction, Methodology, Results and Discussion, Conclusion, Acknowledgements, References</li></ul></div>
<div class="box"><h4>✍️ Format</h4><ul><li>English only</li><li>Use the STT52 templates; submit both Word (.doc/.docx) and PDF</li><li>Single line spacing, fully justified, 0 pt before/after paragraphs</li></ul></div>
<div class="box"><h4>⚖️ Other rules</h4><ul><li>Original, unpublished work only — plagiarism means rejection</li><li>All submissions are peer-reviewed</li><li><b>No change of type or content after acceptance</b></li><li>Templates: <a href="${LINKS.tplAbs}" target="_blank">Abstract (.docx)</a> · <a href="${LINKS.tplFull}" target="_blank">Full paper (.doc)</a></li></ul></div>
</div>
<p class="muted">Source: <a href="${LINKS.cfp}" target="_blank">STT52 Call for Papers</a></p>
<h3>📋 Requirement worksheet for your target conference</h3>
<p>Fill it from the actual call you are submitting to (press the button to see an STT52 example).</p>{{w:cfp}}`},

{ id:"abstract", nav:{th:"เขียนบทคัดย่อ",en:"Writing the abstract"},
  th:`<div class="eyebrow">ช่วงเตรียมผลงาน · 4</div><h2>เขียนบทคัดย่อ (Abstract)</h2>
<p>บทคัดย่อคือ "โฆษณา" ของงานเรา กรรมการใช้ตัดสินว่ารับหรือไม่ และผู้ฟังใช้ตัดสินว่าจะเข้าห้องเราหรือไม่ ต้องอ่านเข้าใจได้โดยไม่ต้องอ่านอย่างอื่นประกอบ</p>
<h3>โครงสร้าง 5 ส่วน (สำหรับ ~200 คำ)</h3>
<div class="tblwrap"><table><thead><tr><th>ส่วน</th><th>ประมาณ</th><th>เขียนอะไร</th></tr></thead><tbody>
<tr><td>1. Background</td><td>1–2 ประโยค · ~30 คำ</td><td>บริบท ปัญหา และช่องว่างความรู้</td></tr>
<tr><td>2. Aim / hypothesis</td><td>1 ประโยค · ~20 คำ</td><td>วัตถุประสงค์หรือสมมติฐานที่ชัดเจน</td></tr>
<tr><td>3. Methods</td><td>2–3 ประโยค · ~50 คำ</td><td>ตัวอย่าง/พื้นที่ศึกษา จำนวน วิธีหลัก การวิเคราะห์ (เฉพาะที่จำเป็น)</td></tr>
<tr><td>4. Results</td><td>2–3 ประโยค · ~70 คำ</td><td>ผลสำคัญ <b>พร้อมตัวเลข</b> (ค่า, %, p-value) ห้ามเขียนว่า "จะนำเสนอผลในงาน"</td></tr>
<tr><td>5. Conclusion</td><td>1–2 ประโยค · ~30 คำ</td><td>ความหมายของผล การนำไปใช้ หรือก้าวต่อไป — ไม่สรุปเกินข้อมูล</td></tr>
</tbody></table></div>
<div class="grid2">
<div class="box"><h4>✅ ควรทำ</h4><ul>
<li>ชื่อเรื่อง 10–15 คำ บอกว่าศึกษาอะไร (อาจตามด้วยวิธี) เขียนบทคัดย่อเสร็จก่อนแล้วค่อยตั้งชื่อ</li>
<li>Past tense สำหรับวิธีการและผล · Present tense สำหรับข้อเท็จจริงที่รู้กันและข้อสรุป</li>
<li>นิยามตัวย่อเมื่อใช้ครั้งแรก ใช้ชื่อวิทยาศาสตร์ถูกต้อง (ตัวเอียง)</li>
<li>เลือก keywords 3–5 คำที่ไม่ซ้ำกับชื่อเรื่อง</li>
<li>ให้อาจารย์และเพื่อนต่างสาขาอ่าน — ถ้าเขาสรุปงานเราได้ถูก แปลว่าชัดพอ</li></ul></div>
<div class="box"><h4>⛔ ไม่ควรทำ</h4><ul>
<li>เกินจำนวนคำ/หน้า (อาจถูกปฏิเสธทันที)</li>
<li>ใส่เอกสารอ้างอิง ศัพท์เฉพาะมากเกินไป หรือตัวย่อที่ไม่นิยาม</li>
<li>เขียนวิธีการละเอียดเกินจนไม่มีที่ให้ผลลัพธ์</li>
<li>ผลลัพธ์คลุมเครือ เช่น "results will be discussed"</li>
<li>ข้อสรุปที่ข้อมูลไม่รองรับ หรือคัดลอกประโยคจากงานผู้อื่น</li></ul></div>
</div>
<h3>✏️ เครื่องมือเขียนและนับคำบทคัดย่อ</h3>
<p class="muted">STT52 กำหนดให้เขียนเป็นภาษาอังกฤษ — กรอกแต่ละส่วน ระบบจะนับคำ ประกอบเป็นย่อหน้า และตรวจจุดที่พบบ่อย</p>{{w:abstract}}`,
  en:`<div class="eyebrow">Preparing your work · 4</div><h2>Writing the abstract</h2>
<p>The abstract is the "advertisement" for your work: reviewers use it to accept or reject, and attendees use it to choose your room. It must make sense on its own.</p>
<h3>Five-part structure (for ~200 words)</h3>
<div class="tblwrap"><table><thead><tr><th>Part</th><th>Approx.</th><th>What to write</th></tr></thead><tbody>
<tr><td>1. Background</td><td>1–2 sentences · ~30 words</td><td>Context, problem and knowledge gap</td></tr>
<tr><td>2. Aim / hypothesis</td><td>1 sentence · ~20 words</td><td>A clear objective or hypothesis</td></tr>
<tr><td>3. Methods</td><td>2–3 sentences · ~50 words</td><td>Samples/site, numbers, key methods, analysis (essentials only)</td></tr>
<tr><td>4. Results</td><td>2–3 sentences · ~70 words</td><td>Key findings <b>with numbers</b> (values, %, p-values) — never "results will be presented"</td></tr>
<tr><td>5. Conclusion</td><td>1–2 sentences · ~30 words</td><td>What it means, applications or next steps — don't overclaim</td></tr>
</tbody></table></div>
<div class="grid2">
<div class="box"><h4>✅ Do</h4><ul>
<li>Title of 10–15 words saying what you studied (optionally the method); write the abstract first, then the title</li>
<li>Past tense for methods and results · present tense for established facts and conclusions</li>
<li>Define acronyms at first use; write scientific names correctly (italic)</li>
<li>Choose 3–5 keywords not already in the title</li>
<li>Ask your advisor and a friend from another field to read it — if they can summarise it, it's clear enough</li></ul></div>
<div class="box"><h4>⛔ Don't</h4><ul>
<li>Exceed the word/page limit (may be rejected outright)</li>
<li>Include references, heavy jargon or undefined acronyms</li>
<li>Spend so many words on methods that results get squeezed</li>
<li>Write vague results such as "results will be discussed"</li>
<li>Draw conclusions your data don't support, or copy sentences from others</li></ul></div>
</div>
<h3>✏️ Abstract builder & word counter</h3>
<p class="muted">STT52 requires English — fill in each part; the tool counts words, assembles the paragraph and checks common problems.</p>{{w:abstract}}`},

{ id:"fullpaper", nav:{th:"เขียนบทความฉบับเต็ม",en:"Writing the full paper"},
  th:`<div class="eyebrow">ช่วงเตรียมผลงาน · 5</div><h2>เขียนบทความฉบับเต็ม (Full paper / Proceedings)</h2>
<p>บทความฉบับเต็มสำหรับ proceedings คือบทความวิจัยขนาดสั้น (STT52: 6–10 หน้า รวมรูป ตาราง และเอกสารอ้างอิง) ใช้โครงสร้าง IMRaD และ <b>เขียนใน template ทางการตั้งแต่เริ่ม</b> เพื่อให้เห็นจำนวนหน้าจริงตลอดเวลา</p>
<div class="tblwrap"><table><thead><tr><th>หัวข้อ</th><th>สัดส่วนโดยประมาณ</th><th>หลักการ</th></tr></thead><tbody>
<tr><td>Title / Authors / Affiliation</td><td>—</td><td>ตาม template เป๊ะ: ลำดับชื่อ, ตัวยก (superscript) สังกัด, อีเมล corresponding author</td></tr>
<tr><td>Abstract + Keywords</td><td>~200 คำ</td><td>ใช้หลักเดียวกับหัวข้อก่อนหน้า (STT52 ส่ง abstract พร้อม full paper)</td></tr>
<tr><td>Introduction</td><td>~1 หน้า</td><td>จากกว้างไปแคบ (funnel): ความสำคัญ → สิ่งที่รู้แล้ว (อ้างอิง) → ช่องว่าง → วัตถุประสงค์</td></tr>
<tr><td>Methodology</td><td>1–2 หน้า</td><td>ละเอียดพอให้ผู้อื่นทำซ้ำได้: วัสดุ/ตัวอย่าง พื้นที่ เครื่องมือ (รุ่น/ผู้ผลิต) สถิติ ใบอนุญาต/จริยธรรม</td></tr>
<tr><td>Results and Discussion</td><td>2–4 หน้า</td><td>เล่าตามรูป/ตาราง เปรียบเทียบกับงานอื่น อธิบายเหตุผล และระบุข้อจำกัด</td></tr>
<tr><td>Conclusion</td><td>1 ย่อหน้า</td><td>ตอบวัตถุประสงค์ทีละข้อ ไม่ใส่ข้อมูลใหม่</td></tr>
<tr><td>Acknowledgements</td><td>2–3 บรรทัด</td><td>แหล่งทุน (เลขที่สัญญา), ผู้ช่วยเหลือ, หน่วยงานที่ให้ใช้เครื่องมือ/พื้นที่</td></tr>
<tr><td>References</td><td>~0.5–1 หน้า</td><td>รูปแบบเดียวตาม template ทุกรายการที่อ้างในเนื้อหาต้องมีในรายการและกลับกัน (ใช้ Zotero/EndNote/Mendeley ช่วย)</td></tr>
</tbody></table></div>
<div class="grid2">
<div class="box"><h4>📊 รูปและตาราง</h4><ul>
<li>ทุกรูป/ตารางมีหมายเลขและคำบรรยายที่อ่านเข้าใจได้ด้วยตัวเอง</li>
<li>ความละเอียด ≥300 dpi ตัวอักษรในรูปอ่านออกเมื่อพิมพ์ ระบุหน่วยและ error bar</li>
<li>อ้างถึงในเนื้อหาก่อนรูปปรากฏ ("as shown in Fig. 1")</li>
<li>ไม่แสดงข้อมูลเดียวกันซ้ำทั้งในรูปและตาราง</li></ul></div>
<div class="box"><h4>⚠️ ข้อควรระวัง</h4><ul>
<li><b>ความเป็นต้นฉบับ:</b> ไม่ใช้เนื้อหาที่ตีพิมพ์แล้ว รวมถึงของตัวเอง; ตรวจความซ้ำก่อนส่ง</li>
<li><b>ผลต่อการตีพิมพ์วารสารภายหลัง:</b> ข้อมูลที่ลง proceedings ฉบับเต็มแล้ว บางวารสารถือว่าตีพิมพ์แล้ว — ปรึกษาอาจารย์ว่าจะส่งแค่ abstract หรือ full paper</li>
<li><b>ผู้แต่ง:</b> ตกลงลำดับชื่อและให้ทุกคนอนุมัติก่อนส่ง</li>
<li><b>AI:</b> ใช้ช่วยภาษาได้ตามนโยบายของงาน แต่ผู้เขียนรับผิดชอบความถูกต้องทุกประโยคและทุกการอ้างอิง</li>
<li>STT52: <b>เปลี่ยนประเภทหรือเนื้อหาหลังตอบรับไม่ได้</b></li></ul></div>
</div>
<h3>ขั้นตอนการเขียนที่แนะนำ</h3>
<ol>
<li>ทำรูปและตารางหลักก่อน (ผลคือแกนของเรื่อง)</li>
<li>เขียน Methodology → Results and Discussion → Conclusion → Introduction → Abstract → Title</li>
<li>ส่งอาจารย์ตรวจอย่างน้อย 2 รอบ เผื่อเวลารอบละ ~1 สัปดาห์</li>
<li>ตรวจภาษา ตรวจความซ้ำ ตรวจการอ้างอิง</li>
<li>แปลงเป็น PDF แล้วตรวจอีกครั้ง (ฟอนต์ สมการ รูป ตัวอักษรพิเศษ จำนวนหน้า)</li>
</ol>`,
  en:`<div class="eyebrow">Preparing your work · 5</div><h2>Writing the full paper (proceedings)</h2>
<p>A proceedings full paper is a short research article (STT52: 6–10 pages including figures, tables and references). Use the IMRaD structure and <b>write inside the official template from the start</b> so you always see the real page count.</p>
<div class="tblwrap"><table><thead><tr><th>Section</th><th>Approx. share</th><th>Principles</th></tr></thead><tbody>
<tr><td>Title / Authors / Affiliation</td><td>—</td><td>Follow the template exactly: author order, superscript affiliations, corresponding-author email</td></tr>
<tr><td>Abstract + Keywords</td><td>~200 words</td><td>Same principles as the previous section (STT52 requires the abstract together with the full paper)</td></tr>
<tr><td>Introduction</td><td>~1 page</td><td>Funnel: importance → what is known (cited) → gap → objectives</td></tr>
<tr><td>Methodology</td><td>1–2 pages</td><td>Enough detail to replicate: materials/samples, site, instruments (model/maker), statistics, permits/ethics</td></tr>
<tr><td>Results and Discussion</td><td>2–4 pages</td><td>Tell the story through figures/tables, compare with other studies, explain, state limitations</td></tr>
<tr><td>Conclusion</td><td>1 paragraph</td><td>Answer each objective; no new data</td></tr>
<tr><td>Acknowledgements</td><td>2–3 lines</td><td>Funding (grant numbers), helpers, facilities and site access</td></tr>
<tr><td>References</td><td>~0.5–1 page</td><td>One style per the template; every in-text citation is listed and vice versa (use Zotero/EndNote/Mendeley)</td></tr>
</tbody></table></div>
<div class="grid2">
<div class="box"><h4>📊 Figures & tables</h4><ul>
<li>Every figure/table is numbered with a self-explanatory caption</li>
<li>≥300 dpi; text legible when printed; units and error bars shown</li>
<li>Cite in the text before it appears ("as shown in Fig. 1")</li>
<li>Don't show the same data in both a figure and a table</li></ul></div>
<div class="box"><h4>⚠️ Watch out</h4><ul>
<li><b>Originality:</b> no previously published content, including your own; run a similarity check</li>
<li><b>Later journal publication:</b> some journals treat a full proceedings paper as prior publication — discuss with your advisor whether to submit only an abstract</li>
<li><b>Authorship:</b> agree on author order and get everyone's approval before submitting</li>
<li><b>AI:</b> language help may be allowed by the conference policy, but authors are responsible for every sentence and citation</li>
<li>STT52: <b>no change of type or content after acceptance</b></li></ul></div>
</div>
<h3>Recommended writing order</h3>
<ol>
<li>Make the key figures and tables first (results are the backbone)</li>
<li>Write Methodology → Results and Discussion → Conclusion → Introduction → Abstract → Title</li>
<li>At least two advisor review rounds, allowing ~1 week each</li>
<li>Check language, similarity and references</li>
<li>Export to PDF and check again (fonts, equations, figures, special characters, page count)</li>
</ol>`},

{ id:"submit", nav:{th:"ส่งผลงาน & หลังพิจารณา",en:"Submitting & after review"},
  th:`<div class="eyebrow">ช่วงเตรียมผลงาน · 6</div><h2>ตรวจก่อนกดส่ง และจัดการหลังผลพิจารณา</h2>
<h3>Checklist ก่อนกดส่ง</h3>{{w:check:submit}}
<div class="grid2">
<div class="box"><h4>📨 เมื่อได้รับผลพิจารณา</h4><ul>
<li>อ่านความเห็นผู้ประเมินทุกข้อ (อ่านรอบแรกแล้วพักก่อน ค่อยกลับมาแก้)</li>
<li>ทำตาราง "ความเห็น – การแก้ไข – ตำแหน่งที่แก้" ให้อาจารย์ตรวจ</li>
<li>แก้ไขให้ครบและส่งภายในกำหนด (STT52 มีวันส่งแก้ไขแยกตามรอบ)</li>
<li>ถ้าไม่เห็นด้วยกับความเห็นใด ให้ตอบอย่างสุภาพพร้อมเหตุผลและหลักฐาน</li></ul></div>
<div class="box"><h4>🧾 หลังตอบรับ</h4><ul>
<li>ลงทะเบียนและชำระเงินก่อนปิด early-bird (STT52: 31 ต.ค. 2569)</li>

function getPath(path){ return path.split(".").reduce((o,k)=> o==null?undefined:o[k], S); }
function setPath(path,val){
  const ks=path.split("."); let o=S;
  for(let i=0;i<ks.length-1;i++){ const k=ks[i]; if(o[k]==null) o[k] = /^\d+$/.test(ks[i+1]) ? [] : {}; o=o[k]; }
  o[ks[ks.length-1]]=val;
}
function filled(v){ return v!==undefined && v!==null && String(v).trim()!=="" && v!==false; }

/* ---------- Assignment state helpers ---------- */
function A(id){
  const def = ASSIGN.find(x=>x.id===id);
  S.a[id] = S.a[id] || {f:{},t:{},r:[]};
  const a=S.a[id]; a.f=a.f||{}; a.t=a.t||{}; a.r=a.r||[];
  if(def.repeat) while(a.r.length<def.repeat.min) a.r.push({});
  if(def.skills){ a.sk=a.sk||{pre:{},post:{}}; }
  return a;
}
function itemDone(def,it){
  if(!it) return false;
  const n = def.repeat.fields.filter(f=>f.type!=="check" && f.type!=="score5" && filled(it[f.k])).length;
  return n >= Math.min(3, def.repeat.fields.filter(f=>f.type!=="check"&&f.type!=="score5").length);
}
function asgStats(def){
  const a=A(def.id); let done=0,total=0;
  def.tasks.forEach((_,i)=>{ total++; if(a.t[i]) done++; });
  def.fields.forEach(f=>{ total++; if(filled(a.f[f.k])) done++; });
  if(def.repeat){ total+=def.repeat.min; done+=Math.min(def.repeat.min, a.r.filter(it=>itemDone(def,it)).length); }
  if(def.skills){ total+=2; if(Object.keys(a.sk.pre).length>=SKILLS.length) done++; if(Object.keys(a.sk.post).length>=SKILLS.length) done++; }
  if(def.includePlan){ total++; if(planCount()>=4) done++; }
  return {done,total,pct: total? Math.round(done/total*100):0};
}
function overall(){
  let pts=0,earned=0; ASSIGN.forEach(d=>{ const s=asgStats(d); pts+=d.pts; earned+=d.pts*s.pct/100; });
  return Math.round(earned/pts*100);
}

function rubricBlock(base){
  const obj=getPath(base)||{}; const tot=RUBRIC.reduce((s,c)=>s+(obj[c.k]||0),0);
  return RUBRIC.map(c=>`<div class="crit"><div><b>${L(c)}</b><small>${S.lang==="th"?c.dth:c.den}</small></div>${scoreBtns(base+"."+c.k)}</div>`).join("")

}

function inp(path,label,type="text",opts,ph=""){
  const v=getPath(path);
  if(type==="textarea") return `<label class="f">${esc(label)}</label><textarea data-bind="${path}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
  if(type==="select") return `<label class="f">${esc(label)}</label><select data-bind="${path}">${(opts||[]).map(o=>`<option value="${esc(o.v)}" ${v===o.v?"selected":""}>${esc(L(o))}</option>`).join("")}</select>`;
  if(type==="check") return `<label class="f" style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" data-bind="${path}" ${v?"checked":""} style="width:18px;height:18px;accent-color:var(--accent)"> ${esc(label)}</label>`;
  if(type==="score5") return `<label class="f">${esc(label)}</label>${scoreBtns(path)}`;

}

const ABS_PARTS = [

let SEG=null; try{ SEG=new Intl.Segmenter(undefined,{granularity:"word"}); }catch(e){}
function wc(t){ t=(t||"").trim(); if(!t) return 0;
  if(/[฀-๿]/.test(t) && SEG){ let n=0; for(const s of SEG.segment(t)) if(s.isWordLike) n++; return n; }
  return t.split(/\s+/).filter(w=>/[\p{L}\p{N}]/u.test(w)).length; }
function absState(){ S.abs=S.abs||{limit:200}; if(!S.abs.limit) S.abs.limit=200; return S.abs; }
function absBody(){ const a=absState(); return ABS_PARTS.map(([k])=>(a[k]||"").trim()).filter(Boolean).join(" "); }
function absChecks(){
  const a=absState(), body=absBody(), n=wc(body), lim=+a.limit||200, tw=wc(a.title);
  const acr=[...new Set((body.match(/\b[A-Z][A-Z0-9]{1,}s?\b/g)||[]))].filter(x=>!/^(I|II|III|IV|DNA|RNA|PCR)$/.test(x));
  const undefinedAcr=acr.filter(x=>!new RegExp("\\(\\s*"+x.replace(/s$/,"")+"s?\\s*\\)").test(body));
  const out=[];
  const ok=(c,th,en)=>out.push({c,txt:T(th,en)});
  ok(n>0 && n<=lim, `ความยาว ${n}/${lim} คำ`, `Length ${n}/${lim} words`);
  ok(n>=lim*0.7 || n===0 ? n>0 : false, "ใช้พื้นที่ได้คุ้ม (≥70% ของจำนวนคำที่กำหนด)", "Uses the space well (≥70% of the limit)");
  ok(tw>=6 && tw<=18, `ชื่อเรื่อง ${tw} คำ (แนะนำ 10–15)`, `Title ${tw} words (aim for 10–15)`);
  ok(/\d/.test(a.results||""), "ส่วนผลลัพธ์มีตัวเลข", "Results contain numbers");
  ok(!/will be (discussed|presented|shown)|จะ(นำเสนอ|อภิปราย)/i.test(body), "ไม่มีผลลัพธ์แบบคลุมเครือ (\"will be discussed\")", "No vague results (\"will be discussed\")");
  ok(!/\(([A-Z][a-z]+(\s+et al\.)?,?\s*\d{4})\)|\[\d+(,\s*\d+)*\]/.test(body), "ไม่มีการอ้างอิงเอกสารในบทคัดย่อ", "No citations in the abstract");
  ok(undefinedAcr.length===0, undefinedAcr.length?`ตัวย่อที่อาจยังไม่นิยาม: ${undefinedAcr.join(", ")}`:"ตัวย่อถูกนิยามแล้ว", undefinedAcr.length?`Possibly undefined acronyms: ${undefinedAcr.join(", ")}`:"Acronyms defined");
  ok(wc(a.kw)>0, "มี keywords", "Keywords provided");
  return {n,lim,out};
}

   <div>${inp("student.name",T("ชื่อ–นามสกุล","Full name"))}</div>
   <div>${inp("student.id",T("รหัสนิสิต","Student ID"))}</div>
   <div>${inp("student.program",T("หลักสูตร/สังกัด","Program / affiliation"))}</div>
   <div>${inp("student.advisor",T("อาจารย์ที่ปรึกษา","Advisor"))}</div>
   <div>${inp("student.role",T("บทบาทในงาน","Role at STT52"),"select",[{v:"",th:"— เลือก —",en:"— select —"},{v:"oral",th:"นำเสนอแบบบรรยาย",en:"Oral presenter"},{v:"poster",th:"นำเสนอโปสเตอร์",en:"Poster presenter"},{v:"attendee",th:"ผู้เข้าร่วม",en:"Attendee"}])}</div>
   <div>${inp("student.code",T("รหัสผลงาน (ถ้ามี)","Presentation code (if any)"))}</div>
  </div>
  <div class="statgrid">
   <div class="stat"><b id="ovStat">${ov}%</b><small>${UI.asgProgress[S.lang]}</small></div>
   <div class="stat"><b>${A("A2").r.filter(it=>itemDone(ASSIGN[1],it)).length}/6+</b><small>${T("Talks ที่บันทึก","Talks logged")}</small></div>
   <div class="stat"><b>${A("A3").r.filter(it=>itemDone(ASSIGN[2],it)).length}/5+</b><small>${T("โปสเตอร์ที่ประเมิน","Posters scored")}</small></div>
   <div class="stat"><b>${A("A6").r.filter(it=>filled(it.name)).length}/5</b><small>${T("ผู้ติดต่อใหม่","New contacts")}</small></div>
  </div>
  <div class="tblwrap"><table><thead><tr><th>#</th><th>${T("งาน","Assignment")}</th><th>${T("คะแนน","Pts")}</th><th>${T("กำหนดส่ง","Due")}</th><th>${T("ความคืบหน้า","Progress")}</th></tr></thead><tbody>
  ${ASSIGN.map(d=>{const s=asgStats(d);return `<tr><td>${d.id}</td><td><a href="#${d.id}">${d.icon} ${esc(L(d.title))}</a></td><td>${d.pts}</td><td>${esc(L(d.due))}</td><td style="min-width:110px"><div class="bar"><i id="tb-${d.id}" style="width:${s.pct}%"></i></div></td></tr>`;}).join("")}
  <tr><td></td><td><b>${UI.total[S.lang]}</b></td><td><b>100</b></td><td></td><td></td></tr></tbody></table></div>
  <div class="note">${T("เกณฑ์การให้คะแนนแต่ละงาน: ความครบถ้วนตามจำนวนที่กำหนด (40%) · ความลึกของการวิเคราะห์/สะท้อนคิด (40%) · ความตรงต่อเวลาและจริยธรรม เช่น การขออนุญาตถ่ายภาพ (20%)","Grading for each assignment: completeness vs. required counts (40%) · depth of analysis/reflection (40%) · timeliness and ethics, e.g. photo permissions (20%)")}</div>
  </section>`;
  ASSIGN.forEach(d=>{ h+=renderOne(d); });
  h += `<section class="card" id="asg-export"><h2>📤 ${T("ส่งงาน / ส่งออก","Submit / export")}</h2>
  <p>${T("1) ดาวน์โหลดรายงาน (.md) หรือพิมพ์เป็น PDF · 2) รวมไฟล์ภาพตามชื่อไฟล์ใน A7 · 3) ส่งให้อาจารย์ตามช่องทางที่กำหนด ภายในกำหนดส่งของแต่ละงาน","1) Download the report (.md) or print to PDF · 2) collect the photo files named in A7 · 3) send them to your advisor via the agreed channel by each due date")}</p>
  <div class="row">
   <button class="btn" data-act="dlMd">⬇️ ${T("ดาวน์โหลดรายงาน (.md)","Download report (.md)")}</button>
   <button class="btn" data-act="print">🖨️ ${T("พิมพ์ / บันทึกเป็น PDF","Print / save as PDF")}</button>
   <button class="btn ghost" data-act="backup">💾 ${T("สำรองข้อมูล (.json)","Back up (.json)")}</button>
   <label class="btn ghost" style="cursor:pointer">📂 ${T("กู้คืนข้อมูล","Restore")}<input type="file" accept=".json" id="restoreFile" hidden></label>
   <button class="btn danger" data-act="reset">${T("ล้างข้อมูลทั้งหมด","Clear all data")}</button>
  </div>
  <p class="muted" style="margin-top:.6rem">${T("ข้อมูลอยู่ในเบราว์เซอร์นี้เท่านั้น ไม่ถูกส่งไปที่ใด — ถ้าล้างประวัติเบราว์เซอร์ข้อมูลจะหาย จึงควรสำรองไว้เสมอ","Data stays in this browser only and is never uploaded — clearing browser data erases it, so keep backups.")}</p></section>`;
  $("#main").innerHTML = h;
  setupSpy();
}
function renderOne(d){
  const a=A(d.id); const s=asgStats(d); const p=`a.${d.id}`;
  let h=`<section class="card asg" id="${d.id}"><div class="asg-head"><div><div class="eyebrow">${d.id}</div><h2>${d.icon} ${esc(L(d.title))}</h2></div>
  <div style="min-width:140px;text-align:right"><small>${T("ความคืบหน้า","Progress")} <b id="pc-${d.id}">${s.pct}%</b></small><div class="bar"><i id="pb-${d.id}" style="width:${s.pct}%"></i></div></div></div>
  <div class="asg-meta"><span class="pill">${d.pts} ${T("คะแนน","pts")}</span><span class="pill warn">⏰ ${esc(L(d.due))}</span><span class="pill gray">${esc(L(d.skill))}</span></div>
  <p><b>${T("เป้าหมาย:","Goal:")}</b> ${esc(L(d.goal))}</p>`;
  if(d.tasks.length) h+=`<ul class="check">${d.tasks.map((t,i)=>`<li class="${a.t[i]?"done":""}"><input type="checkbox" id="t-${d.id}-${i}" data-bind="${p}.t.${i}" ${a.t[i]?"checked":""}><label for="t-${d.id}-${i}"><span>${esc(L(t))}</span></label></li>`).join("")}</ul>`;
  if(d.includePlan) h+=`<div class="box"><b>${T("ตารางจาก Planner","Schedule from the Planner")}</b> <span class="pill">${planCount()}</span><pre class="out" style="margin:.4rem 0">${esc(mySchedule(false)||T("ยังไม่ได้เลือก — ไปที่ส่วนที่ 1 › วางแผนเวลา & ห้อง","Nothing yet — go to Part 1 › Time & room planner"))}</pre><button class="btn sm ghost" data-act="goPlanner">${T("เปิด Planner","Open Planner")}</button></div>`;
  if(d.fields.length && d.mode) h+=d.fields.map(f=>inp(`${p}.f.${f.k}`,L(f),f.type,f.opts)).join("");
  if(d.repeat){
    const r=d.repeat; const n=a.r.filter(it=>itemDone(d,it)).length;
    h+=`<h3 style="margin-top:1rem">${esc(L(r.label))} <span class="pill ${n>=r.min?"":"warn"}">${n}/${r.min}${T(" (ขั้นต่ำ)"," (min)")}</span></h3>`;
    a.r.forEach((it,i)=>{
      h+=`<div class="item"><h4>${esc(L(r.label))} ${i+1}${it.name?` · ${esc(it.name)}`:it.title?` · ${esc(it.title)}`:it.code?` · ${esc(it.code)}`:""}</h4>${a.r.length>r.min?`<button class="btn sm danger del" data-act="delItem" data-id="${d.id}" data-i="${i}">${UI.del[S.lang]}</button>`:""}
      <div class="fgrid">${r.fields.filter(f=>f.type!=="textarea").map(f=>`<div>${inp(`${p}.r.${i}.${f.k}`,L(f),f.type,f.opts)}</div>`).join("")}</div>
      ${r.fields.filter(f=>f.type==="textarea").map(f=>inp(`${p}.r.${i}.${f.k}`,L(f),f.type)).join("")}
      ${r.rubric?`<details class="more" ${it.rub?"open":""}><summary>${T("ให้คะแนนตามเกณฑ์ 6 ข้อ","Score with the 6-criterion rubric")}</summary>${rubricBlock(`${p}.r.${i}.rub`)}</details>`:""}</div>`;
    });
    h+=`<button class="btn ghost" data-act="addItem" data-id="${d.id}">${UI.add[S.lang]}</button>`;
  }
  if(d.skills){
    h+=`<h3 style="margin-top:1rem">${T("ประเมินทักษะตนเอง (1 = เริ่มต้น, 5 = มั่นใจมาก)","Skills self-assessment (1 = beginner, 5 = very confident)")}</h3><div class="tblwrap"><table><thead><tr><th>${T("ทักษะ","Skill")}</th><th>${T("ก่อนไป","Before")}</th><th>${T("หลังกลับ","After")}</th></tr></thead><tbody>
    ${SKILLS.map(k=>`<tr><td>${esc(L(k))}</td><td>${scoreBtns(`${p}.sk.pre.${k.k}`)}</td><td>${scoreBtns(`${p}.sk.post.${k.k}`)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if(d.fields.length && !d.mode) h+=d.fields.map(f=>inp(`${p}.f.${f.k}`,L(f),f.type,f.opts)).join("");
  h+=`</section>`;
  return h;
}

/* ---------- Report ---------- */
function report(){
  const st=S.student; const lines=[];
  lines.push(`# ${T("รายงานการเข้าร่วมประชุมวิชาการ STT52","STT52 Conference Report")}`);
  lines.push(`${T("ชื่อ","Name")}: ${st.name||""} | ${T("รหัส","ID")}: ${st.id||""} | ${T("หลักสูตร","Program")}: ${st.program||""}`);
  lines.push(`${T("อาจารย์ที่ปรึกษา","Advisor")}: ${st.advisor||""} | ${T("บทบาท","Role")}: ${st.role||""} ${st.code?"("+st.code+")":""}`);
  lines.push(`${T("ความคืบหน้ารวม","Overall progress")}: ${overall()}% | ${T("วันที่ส่งออก","Exported")}: ${new Date().toLocaleString(S.lang==="th"?"th-TH":"en-GB")}`,"");
  ASSIGN.forEach(d=>{
    const a=A(d.id); const s=asgStats(d);
    lines.push(`## ${d.id} ${L(d.title)} (${d.pts} ${T("คะแนน","pts")}) — ${s.pct}%`);
    d.tasks.forEach((t,i)=>lines.push(`- [${a.t[i]?"x":" "}] ${L(t)}`));
    if(d.includePlan){ lines.push("",`### ${T("ตารางส่วนตัว","Personal schedule")}`, mySchedule(false)||"-"); }
    d.fields.forEach(f=>{ let v=a.f[f.k]; if(f.type==="select") v=L((f.opts||[]).find(o=>o.v===v))||""; lines.push("",`**${L(f)}**`, filled(v)?String(v):"-"); });
    if(d.repeat){
      a.r.forEach((it,i)=>{
        if(!Object.keys(it).some(k=>filled(it[k]))) return;
        lines.push("",`### ${L(d.repeat.label)} ${i+1}`);
        d.repeat.fields.forEach(f=>{ let v=it[f.k]; if(f.type==="select") v=L((f.opts||[]).find(o=>o.v===v)); if(f.type==="check") v=v?"✔":"✘"; if(filled(v)||f.type==="check") lines.push(`- ${L(f)}: ${v}`); });
        if(it.rub){ const tot=RUBRIC.reduce((s,c)=>s+(it.rub[c.k]||0),0); lines.push(`- ${T("คะแนนเกณฑ์","Rubric")}: ${RUBRIC.map(c=>`${L(c)} ${it.rub[c.k]||"-"}`).join(" · ")} → **${tot}/30**`); }
      });
    }
    if(d.skills){ lines.push("",`### ${T("ประเมินทักษะ (ก่อน → หลัง)","Skills (before → after)")}`); SKILLS.forEach(k=>lines.push(`- ${L(k)}: ${a.sk.pre[k.k]||"-"} → ${a.sk.post[k.k]||"-"}`)); }
    lines.push("");
  });
  return lines.join("\n");
}
function download(name,text,type){ const b=new Blob([text],{type}); const u=URL.createObjectURL(b); const x=document.createElement("a"); x.href=u; x.download=name; document.body.appendChild(x); x.click(); x.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
const fname = ext => `STT52_${(S.student.id||S.student.name||"student").replace(/[^\w฀-๿-]+/g,"_")}.${ext}`;

/* ---------- Render root ---------- */
function render(keepScroll){
  const y=window.scrollY;
  document.documentElement.lang=S.lang; document.body.classList.remove("lang-th","lang-en"); document.body.classList.add("lang-"+S.lang);
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===S.lang));
  document.querySelectorAll(".tabs [data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  $("#tabGuide").textContent=UI.tabGuide[S.lang]; $("#tabAsg").textContent=UI.tabAsg[S.lang];
  $("#brandTitle").textContent=UI.brandTitle[S.lang]; $("#brandSub").textContent=UI.brandSub[S.lang];
  S.tab==="asg" ? renderAsg() : renderGuide();
  if(keepScroll) window.scrollTo(0,y);
}
function refreshLive(){
  const po=$("#pitchOut"); if(po){ po.textContent=pitchText(); const w=pitchText().split(/\s+/).length; const pl=$("#pitchLen"); if(pl) pl.textContent = S.lang==="en" ? `${w} words ≈ ${Math.round(w/2.3)} s` : `${pitchText().length} ${T("ตัวอักษร","chars")}`; }
  const fo=$("#fuOut"); if(fo) fo.textContent=fuText();
  refreshAbs();
  if(S.tab==="asg"){
    ASSIGN.forEach(d=>{ const s=asgStats(d); const set=(id,fn)=>{const e=$(id); if(e) fn(e);};
      set("#pc-"+d.id,e=>e.textContent=s.pct+"%"); set("#pb-"+d.id,e=>e.style.width=s.pct+"%"); set("#tb-"+d.id,e=>e.style.width=s.pct+"%"); set("#sp-"+d.id,e=>e.textContent=s.pct+"%"); });
    const ov=overall(); ["#ovTxt","#ovStat"].forEach(id=>{const e=$(id); if(e) e.textContent=ov+"%";}); const ob=$("#ovBar"); if(ob) ob.style.width=ov+"%";
  }
}

/* ---------- Events ---------- */
document.addEventListener("input",e=>{
  const el=e.target; if(!el.dataset.bind) return;
  const v = el.type==="checkbox" ? el.checked : el.value;
  setPath(el.dataset.bind, v); save(); if(el.dataset.rerender) return; refreshLive();
  if(el.type==="checkbox"){ const li=el.closest("li"); if(li) li.classList.toggle("done",v); }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.ck){ S.ck[el.dataset.ck]=el.checked; save(); render(true); return; }
  if(el.dataset.rerender){ render(true); return; }
  if(el.dataset.act==="fillFu" && el.value!==""){ const c=A("A6").r[+el.value]; Object.assign(S.fu,{to:c.name||"",topic:c.topic||"",where:c.where||"",next:c.next||""}); save(); render(true); return; }
  if(el.id==="restoreFile" && el.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||typeof d!=="object"||!d.a) throw 0; S=Object.assign(S,d); save(); render(); toast(T("กู้คืนข้อมูลแล้ว","Data restored")); }catch(err){ toast(T("ไฟล์ไม่ถูกต้อง","Invalid file")); } }; r.readAsText(el.files[0]); }
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a[data-nav]"); if(!b) return;
  if(b.dataset.lang){ S.lang=b.dataset.lang; save(); render(true); return; }
  if(b.dataset.tab){ S.tab=b.dataset.tab; save(); try{history.replaceState(null,"",S.tab==="asg"?"#assignments":"#guide");}catch(_){} render(); window.scrollTo(0,0); return; }
  if(b.dataset.blk!==undefined){ const i=b.dataset.blk; S.plan[i]=!S.plan[i]; if(!S.plan[i]) delete S.plan[i]; save(); render(true); return; }
  if(b.dataset.set){ const cur=getPath(b.dataset.set); const v= b.dataset.sv!==undefined ? b.dataset.sv : +b.dataset.val; setPath(b.dataset.set, cur===v?(typeof v==="string"?"":0):v); save(); render(true); return; }
  if(b.dataset.copy){ const t=$("#"+b.dataset.copy).textContent; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(UI.copied[S.lang])).catch(()=>{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast(UI.copied[S.lang]);}catch(_){} ta.remove(); }); return; }
  const act=b.dataset.act; if(!act) return;
  if(act==="addTalk"){ const title=$("#mt-title").value.trim(); if(!title){ toast(T("กรุณาใส่ชื่อเรื่อง","Please enter a title")); return; }
    S.myTalks.push({day:$("#mt-day").value,time:$("#mt-time").value.trim(),room:$("#mt-room").value.trim(),title,pri:$("#mt-pri").value}); save(); render(true); return; }
  if(act==="delTalk"){ S.myTalks.splice(+b.dataset.i,1); save(); render(true); return; }
  if(act==="unblk"){ delete S.plan[b.dataset.i]; save(); render(true); return; }
  if(act==="tlStt"){ S.tl={dl:"2026-07-27",cf:"2026-11-23"}; save(); render(true); return; }
  if(act==="ccClear"){ S.cc={}; save(); render(true); return; }
  if(act==="cfpStt"){ S.cfp={}; CFP_ROWS.forEach(([k,,ex])=>S.cfp[k]=ex); save(); render(true); return; }
  if(act==="cfpClear"){ S.cfp={}; save(); render(true); return; }
  if(act==="cfpCopy"){ const t=CFP_ROWS.map(([k,l])=>`${L(l)}: ${(S.cfp&&S.cfp[k])||"-"}`).join("\n"); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(UI.copied[S.lang])).catch(()=>{}); return; }
  if(act==="absEx"){ S.abs=Object.assign({limit:200},EX_ABS); save(); render(true); return; }
  if(act==="absClear"){ S.abs={limit:200}; save(); render(true); return; }
  if(act==="clearRub"){ S.rub={}; save(); render(true); return; }
  if(act==="addItem"){ A(b.dataset.id).r.push({}); save(); render(true); return; }
  if(act==="delItem"){ if(confirmDel()) { A(b.dataset.id).r.splice(+b.dataset.i,1); save(); render(true);} return; }
  if(act==="pitchToA1"){ setPath("a.A1.f.pitch", ((getPath("a.A1.f.pitch")||"")+(getPath("a.A1.f.pitch")?"\n\n":"")+pitchText())); save(); toast(T("ใส่ในงาน A1 แล้ว","Added to A1")); return; }
  if(act==="goPlanner"){ S.tab="guide"; render(); setTimeout(()=>{ const el=$("#planner"); if(el) el.scrollIntoView(); },50); return; }
  if(act==="dlMd"){ download(fname("md"), report(), "text/markdown;charset=utf-8"); return; }
  if(act==="print"){ $("#printReport").textContent=report(); document.body.classList.add("pr"); setTimeout(()=>window.print(),50); return; }
  if(act==="backup"){ download(fname("json"), JSON.stringify(S,null,1), "application/json"); return; }
  if(act==="reset"){ if(prompt(T("พิมพ์ RESET เพื่อยืนยันการล้างข้อมูลทั้งหมด","Type RESET to confirm clearing all data"))==="RESET"){ const l=S.lang; S={lang:l,tab:"asg",ck:{},plan:{},myTalks:[],rub:{},pitch:{th:{},en:{}},fu:{},student:{},a:{}}; save(); render(); toast(T("ล้างข้อมูลแล้ว","Cleared")); } return; }
});
// in-page delete of a filled item: avoid native dialogs being blocked in some contexts
function confirmDel(){ try{ return window.confirm(T("ลบรายการนี้?","Remove this entry?")); }catch(e){ return true; } }
window.addEventListener("afterprint",()=>{ document.body.classList.remove("pr"); });

render();
refreshLive();

</script>
</body>
